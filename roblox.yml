# Minimal permissive Roblox standard library for selene.
# The real `std = "roblox"` generator needs network access to Roblox's API dump;
# this vendored std keeps selene useful (syntax + core lints) fully offline.
---
base: lua51
name: roblox
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  shared:
    any: true
  Enum:
    any: true
  Instance:
    any: true
  Vector2:
    any: true
  Vector3:
    any: true
  CFrame:
    any: true
  Color3:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Rect:
    any: true
  BrickColor:
    any: true
  TweenInfo:
    any: true
  Random:
    any: true
  Ray:
    any: true
  RaycastParams:
    any: true
  OverlapParams:
    any: true
  PhysicalProperties:
    any: true
  Region3:
    any: true
  Font:
    any: true
  Axes:
    any: true
